[platformio]
default_envs = waveshare_esp32s3_relay_6ch
extra_configs = 
    factory_settings.ini
    features.ini

[env]
framework = arduino
platform = espressif32 @ 7.0.0
extra_scripts = pre:scripts/build_interface.py
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.partitions = partitions_4MB.csv
board_upload.flash_size = 4MB
lib_deps =
    bblanchon/ArduinoJson @ ^7.3.0
    ESP32Async/ESPAsyncWebServer @ ^3.9.4
    ESP32Async/AsyncTCP @ ^3.4.10
    bertmelis/espMqttClient @ ^1.7.0

; Entorno para placa industrial de pruebas eletechsup ES32D26 (ESP32 DevKit 38 pines)
[env:eletechsup_es32d26]
board = esp32doit-devkit-v1
upload_port = COM20
monitor_port = COM20
build_flags = 
    ${factory_settings.build_flags}
    -DBOARD_ELETECHSUP_ES32D26=1
    -DFT_PROJECT=1
    -DFT_SECURITY=1
    -DFT_MQTT=1
    -DFT_NTP=1
    -DFT_OTA=1
    -DFT_UPLOAD_FIRMWARE=1
    -DFT_UPLOAD_FILESYSTEM=1
    -DFT_USE_LANGUAGE=1
    -DNO_GLOBAL_ARDUINOOTA
    -DASYNCWEBSERVER_REGEX
    -DCORE_DEBUG_LEVEL=1

; Entorno para placa definitiva estándar ESP32 DevKit V1 con transceptor auto-switching
[env:esp32doit-devkit-v1]
board = esp32doit-devkit-v1
build_flags = 
    ${factory_settings.build_flags}
    -DFT_PROJECT=1
    -DFT_SECURITY=1
    -DFT_MQTT=1
    -DFT_NTP=1
    -DFT_OTA=1
    -DFT_UPLOAD_FIRMWARE=1
    -DFT_UPLOAD_FILESYSTEM=1
    -DFT_USE_LANGUAGE=1
    -DNO_GLOBAL_ARDUINOOTA
    -DASYNCWEBSERVER_REGEX
    -DCORE_DEBUG_LEVEL=1

; Entorno Maestro Industrial: Waveshare Industrial ESP32-S3 WiFi Relay 6CH con RS-485 Aislado
[env:waveshare_esp32s3_relay_6ch]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_upload.flash_size = 8MB
board_build.partitions = partitions_8MB.csv
upload_port = COM24
monitor_port = COM24
build_flags = 
    ${factory_settings.build_flags}
    -DBOARD_WAVESHARE_ESP32S3_RELAY_6CH=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DFT_PROJECT=1
    -DFT_SECURITY=1
    -DFT_MQTT=1
    -DFT_NTP=1
    -DFT_OTA=1
    -DFT_UPLOAD_FIRMWARE=1
    -DFT_UPLOAD_FILESYSTEM=1
    -DFT_USE_LANGUAGE=1
    -DNO_GLOBAL_ARDUINOOTA
    -DASYNCWEBSERVER_REGEX
    -DPROGMEM_WWW=1
    -DFT_MODBUS_SERIAL_TRACE=1
    -DCORE_DEBUG_LEVEL=1
