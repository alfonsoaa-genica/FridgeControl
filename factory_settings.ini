; The indicated settings support placeholder substitution as follows:
;  #{platform} - The microcontroller platform, e.g. "esp32" or "esp8266"
;  #{unique_id} - A unique identifier derived from the MAC address, e.g. "0b0a859d6816"
;  #{random} - A random number encoded as a hex string, e.g. "55722f94"

[factory_settings]
build_flags =
  ; WiFi settings
  -D FACTORY_WIFI_SSID=\"\"
  -D FACTORY_WIFI_PASSWORD=\"\"
  -D FACTORY_WIFI_HOSTNAME=\"fridgecontrol-#{unique_id}\"

  ; Access point settings
  -D FACTORY_AP_PROVISION_MODE=AP_MODE_ALWAYS
  -D FACTORY_AP_SSID=\"FridgeControl-#{unique_id}\"
  -D FACTORY_AP_PASSWORD=\"genica2026\"
  -D FACTORY_AP_CHANNEL=1
  -D FACTORY_AP_SSID_HIDDEN=false
  -D FACTORY_AP_MAX_CLIENTS=4
  -D FACTORY_AP_LOCAL_IP=\"192.168.40.1\"
  -D FACTORY_AP_GATEWAY_IP=\"192.168.40.1\"
  -D FACTORY_AP_SUBNET_MASK=\"255.255.255.0\"

  ; User credentials for admin and guest user
  -D FACTORY_ADMIN_USERNAME=\"admin\"
  -D FACTORY_ADMIN_PASSWORD=\"admin\"
  -D FACTORY_GUEST_USERNAME=\"guest\"
  -D FACTORY_GUEST_PASSWORD=\"guest\"

  ; NTP settings
  -D FACTORY_NTP_ENABLED=true
  -D FACTORY_NTP_TIME_ZONE_LABEL=\"America/Caracas\"
  -D FACTORY_NTP_TIME_ZONE_FORMAT=\"VET4\"
  -D FACTORY_NTP_SERVER=\"pool.ntp.org\"

  ; OTA settings
  -D FACTORY_OTA_PORT=8266
  -D FACTORY_OTA_PASSWORD=\"fridgecontrol\"
  -D FACTORY_OTA_ENABLED=true

  ; MQTT settings
  -D FACTORY_MQTT_ENABLED=true
  -D FACTORY_MQTT_HOST=\"192.168.1.100\"
  -D FACTORY_MQTT_PORT=1883
  -D FACTORY_MQTT_USERNAME=\"\"
  -D FACTORY_MQTT_PASSWORD=\"\"
  -D FACTORY_MQTT_CLIENT_ID=\"fridgecontrol-#{unique_id}\"
  -D FACTORY_MQTT_KEEP_ALIVE=60
  -D FACTORY_MQTT_CLEAN_SESSION=true
  -D FACTORY_MQTT_MAX_TOPIC_LENGTH=128

  ; JWT Secret
  -D FACTORY_JWT_SECRET=\"#{random}-#{random}\"
